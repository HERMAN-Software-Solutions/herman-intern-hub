name: ✨ Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem before the solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point. What are you trying to do that's hard today?
      placeholder: |
        Right now, mentors have to manually export each intern's data...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
      placeholder: |
        A "Export CSV" button on the interns list that downloads all filtered interns.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you think about?
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this belong to?
      options:
        - Phase 1 — MVP (already shipped)
        - Phase 2 — Documents & Reviews (already shipped)
        - Phase 3 — Public Presence (already shipped)
        - Phase 4 — Expansion
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: How important is this?
      options:
        - 🚨 Critical — blocks work
        - 🔥 High — painful today
        - 💡 Nice to have
        - 🌱 Idea for later
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, examples from other tools, etc.
    validations:
      required: false